name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JUCE needs these to build its GUI and audio device layers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # JUCE is a large checkout; caching it keeps subsequent runs short.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: List artefacts
        shell: bash
        run: find build/Click_artefacts -maxdepth 3 -print

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Click-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/Click_artefacts/Release/VST3/**
            build/Click_artefacts/Release/AU/**
            build/Click_artefacts/Release/Standalone/**
