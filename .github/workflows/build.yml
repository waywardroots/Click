name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JUCE needs these to build its GUI and audio device layers on Linux.
      # xvfb lets pluginval open the editor on a headless runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb

      # JUCE is a large checkout; caching it keeps subsequent runs short.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: List artefacts
        shell: bash
        run: find build/Click_artefacts -maxdepth 3 -print

      # Uploaded before validation so the binaries are available even when
      # validation finds a problem.
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Click-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/Click_artefacts/Release/VST3/**
            build/Click_artefacts/Release/AU/**
            build/Click_artefacts/Release/Standalone/**

      # pluginval exercises the plugin the way a host does: bus layouts, state
      # save/restore, parameter sweeps, editor open/close, and audio processing
      # on background threads. It catches most "won't load in my DAW" faults.
      - name: Validate with pluginval
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/Tracktion/pluginval/releases/latest/download

          case "${{ runner.os }}" in
            Linux)
              curl -sSL "$base/pluginval_Linux.zip" -o pluginval.zip
              unzip -q pluginval.zip
              chmod +x pluginval
              run="xvfb-run -a ./pluginval"
              ;;
            macOS)
              curl -sSL "$base/pluginval_macOS.zip" -o pluginval.zip
              unzip -q pluginval.zip
              run="./pluginval.app/Contents/MacOS/pluginval"
              ;;
            Windows)
              curl -sSL "$base/pluginval_Windows.zip" -o pluginval.zip
              unzip -q pluginval.zip
              run="./pluginval.exe"
              ;;
          esac

          $run --strictness-level 8 \
               --validate-in-process \
               --timeout-ms 300000 \
               "build/Click_artefacts/Release/VST3/Click.vst3"

      - name: Validate the Audio Unit
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # auval needs the component installed where the system can find it.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Click_artefacts/Release/AU/Click.component \
                ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Clik Fuzz
